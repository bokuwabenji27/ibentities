
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="iBentities — my personal space.">
  <title>iBentities</title>

  <style>
    :root {
      --paper: #f7f4ed;
      --ink: #39382f;
      --muted: #817d70;
      --line: #dfd8ca;
      --accent: #797b60;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }



.music-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  min-height: 64px;
  padding: 8px 16px;
  border-top: 1px solid var(--line);
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 1000;
}



    .music-brand {
      min-width: 0;
    }

    .music-brand a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-size: 19px;
    }

    .music-brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .player {
      width: min(320px, 55%);
    }

    .player audio {
      display: block;
      width: 100%;
      height: 38px;
    }

    

.page-frame {
  display: block;
  width: 100%;
  height: calc(100vh - 64px);
  border: 0;
  background: var(--paper);
}



    @media (max-width: 520px) {
      
.music-bar {
  min-height: 64px;
  padding: 6px 10px;
  gap: 8px;
}


      .music-brand a {
        font-size: 16px;
      }

      .music-brand p {
        font-size: 10px;
      }

      .player {
        width: 55%;
      }


.page-frame {
  height: calc(100vh - 64px);
}

    }
    
.song-title {
  color: var(--ink);
  font-weight: 700;
  letter-spacing: -0.03em;
  font-size: 16px;
}

.playlist-label {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10px;
}

.player {
  width: min(320px, 55%);
}

.player select {
  display: block;
  width: 100%;
  margin-bottom: 5px;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
}

.player audio {
  display: block;
  width: 100%;
  height: 32px;
}

  </style>
</head>

<body>

<body>
  <iframe
    class="page-frame"
    name="site-content"
    src="home.html"
    title="iBentities website content">
  </iframe>

  <header class="music-bar">

<div class="music-brand">
  <span class="song-title">BGM082 from Nu:Carnival</span>
  <p>Current Mood Song I Listen To</p>
</div>


    
<div class="player">
  <label class="playlist-label" for="playlist">
    Choose a song
  </label>

  <select id="playlist" aria-label="Choose a song">
    <option value="music/BGM082.mp3">BGM082</option>
    <option value="music/BGM001.mp3">BGM001</option>
    <option value="music/BGM005.mp3">BGM005</option>
    <option value="music/BGM007.mp3">BGM007</option>
    <option value="music/BGM008.mp3">BGM008</option>
    <option value="music/BGM060.mp3">BGM060</option>
  </select>

  <audio id="audio-player" controls preload="metadata" loop>
    <source src="music/BGM082.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>
</div>

  </header>
  
<script>
  const playlist = document.getElementById("playlist");
  const audioPlayer = document.getElementById("audio-player");

  playlist.addEventListener("change", function () {
    const wasPlaying = !audioPlayer.paused;

    audioPlayer.src = playlist.value;
    audioPlayer.load();

    if (wasPlaying) {
      audioPlayer.play().catch(function () {
        // The visitor can press Play if playback is blocked.
      });
    }
  });
</script>

</body>

</html>
