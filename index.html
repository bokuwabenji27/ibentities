
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="iBentities — my personal space.">
  <title>iBentities</title>

  <style>
    :root {
      --paper: #f7f4ed;
      --ink: #39382f;
      --muted: #817d70;
      --line: #dfd8ca;
      --accent: #797b60;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }



.music-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  min-height: 64px;
  padding: 8px 16px;
  border-top: 1px solid var(--line);
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 1000;
}



    .music-brand {
      min-width: 0;
    }

    .music-brand a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-size: 19px;
    }

    .music-brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .player {
      width: min(320px, 55%);
    }

    .player audio {
      display: block;
      width: 100%;
      height: 38px;
    }

    

.page-frame {
  display: block;
  width: 100%;
  height: calc(100vh - 64px);
  border: 0;
  background: var(--paper);
}



    @media (max-width: 520px) {
      
.music-bar {
  min-height: 64px;
  padding: 6px 10px;
  gap: 8px;
}


      .music-brand a {
        font-size: 16px;
      }

      .music-brand p {
        font-size: 10px;
      }

      .player {
        width: 55%;
      }


.page-frame {
  height: calc(100vh - 64px);
}

    }
    
.song-title {
  color: var(--ink);
  font-weight: 700;
  letter-spacing: -0.03em;
  font-size: 16px;
}

  </style>
</head>

<body>

<body>
  <iframe
    class="page-frame"
    name="site-content"
    src="home.html"
    title="iBentities website content">
  </iframe>

  <header class="music-bar">

<div class="music-brand">
  <span class="song-title">BGM082</span>
  <p>Current Mood Song I Listen To</p>
</div>


    <div class="player">
      <audio controls preload="metadata" loop>
        <source src="music/BGM082.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>
  </header>
</body>

</html>
